services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: Inverflex/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Investments: Data Source=/data/inverflex.db
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-demo-only-change-before-deployment-32-bytes-min}
    volumes:
      - investments:/data
    ports:
      - "8081:8080"
    depends_on:
      - redis
  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-demo-only-change-before-deployment-32-bytes-min}
    ports:
      - "8080:8080"
    depends_on:
      - api
      - redis
volumes:
  investments:
